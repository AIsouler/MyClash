name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

concurrency:
  group: format-and-test
  cancel-in-progress: true

jobs:
  format:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install tools
        run: npm install -g prettier

      - name: format js files
        run: |
          prettier Script/*.js --write
          prettier "Test/**/*.js" --write

      - name: format yaml files
        run: prettier "**/*.{yml,yaml}" --write

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --cached --quiet || (
            git commit -m "chore: auto format"
            git push
          )

  test:
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install dependencies
        run: npm --prefix Test install

      - name: run tests
        run: node Test/run-tests.js
